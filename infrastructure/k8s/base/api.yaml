apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: contact-resolution-workbench-backend:kind
          imagePullPolicy: Never
          command: [uvicorn, app.main:app, --host, "0.0.0.0", --port, "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
