[project]
name = "contact-resolution-workbench-backend"
version = "0.1.0"
description = "Narrow privacy-safe POC for contact/profile resolution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "celery>=5.5,<6",
    "fastapi>=0.115.0",
    "firebase-admin>=6.6.0",
    "google-genai>=2.25.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.11.0",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "numpy>=2.4,<3",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]
semantic-benchmark = [
    "sentence-transformers==6.1.0",
    "torch>=2.2",
]

# Manual experiments use released CPU wheels, never the default Linux CUDA stack.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
